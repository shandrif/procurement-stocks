<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#F5EDE3">
  <title>Stock Control · ½M</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
  <script>
    try { const t = localStorage.getItem('hm-theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body>
  <!-- Sign in -->
  <main id="login" class="login" hidden>
    <form class="login-card" id="login-form" novalidate>
      <div class="brand-mark brand-mark--lg" aria-hidden="true">½M</div>
      <h1 class="login-title">Stock Control</h1>
      <p class="login-sub">Sign in to see today's inventory.</p>

      <label class="field">
        <span class="field-label">User ID</span>
        <input class="input" id="login-user" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      </label>
      <label class="field">
        <span class="field-label">Password</span>
        <span class="input-wrap">
          <input class="input" id="login-pass" name="password" type="password" autocomplete="current-password" required>
          <button type="button" class="input-action" id="toggle-pass" aria-label="Show password">
            <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M1.5 10S4.5 4 10 4s8.5 6 8.5 6-3 6-8.5 6S1.5 10 1.5 10Z" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="10" cy="10" r="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
          </button>
        </span>
      </label>
      <label class="check">
        <input type="checkbox" id="login-remember">
        <span>Keep me signed in on this device</span>
      </label>
      <p class="form-error" id="login-error" role="alert" hidden></p>
      <button class="btn btn-primary btn-block" type="submit" id="login-submit">
        <span class="btn-label">Sign in</span>
        <span class="spinner" aria-hidden="true"></span>
      </button>
      <p class="login-foot">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
        Stock data is encrypted and only opens with this login.
      </p>
    </form>
  </main>

  <!-- App -->
  <div id="app" class="app" hidden>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">½M</div>
          <div class="brand-text">
            <span class="brand-title">Stock Control</span>
            <span class="brand-sub" id="updated-at">—</span>
          </div>
        </div>
        <nav class="tabs" id="tabs" aria-label="Sections">
          <button class="tab" data-view="overview" aria-current="page">Overview</button>
          <button class="tab" data-view="inventory">Inventory <span class="tab-count" id="count-all"></span></button>
          <button class="tab" data-view="critical">Critical <span class="tab-count tab-count--critical" id="count-critical"></span></button>
          <button class="tab" data-view="out">Out of stock <span class="tab-count tab-count--out" id="count-out"></span></button>
        </nav>
        <div class="topbar-actions">
          <button class="icon-btn" id="btn-refresh" aria-label="Reload data" title="Reload data">
            <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-1.9-4.6M16.5 3.5v3.5H13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="icon-btn" id="btn-theme" aria-label="Switch light or dark" title="Light / dark">
            <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M16.5 12.3A7 7 0 0 1 7.7 3.5a7 7 0 1 0 8.8 8.8Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
          </button>
          <button class="btn btn-ghost" id="btn-logout">Sign out</button>
        </div>
      </div>
    </header>

    <div class="banner" id="sample-banner" hidden>
      <strong>Sample data.</strong> The real stock file isn't connected yet. Numbers below are placeholders in the same format.
    </div>

    <main class="page" id="page"></main>
  </div>

  <!-- Item drawer -->
  <div class="drawer-root" id="drawer" hidden>
    <div class="drawer-overlay" data-close></div>
    <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" tabindex="-1">
      <div class="drawer-head">
        <div>
          <p class="eyebrow" id="drawer-eyebrow"></p>
          <h2 class="drawer-title" id="drawer-title"></h2>
        </div>
        <button class="icon-btn" data-close aria-label="Close">
          <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="drawer-body" id="drawer-body"></div>
    </aside>
  </div>

  <div class="toaster" id="toaster" aria-live="polite"></div>

  <div class="boot" id="boot"><div class="brand-mark brand-mark--lg">½M</div></div>

  <script type="module" src="assets/app.js"></script>
</body>
</html>
